# Perfil oracle: Oracle real (Docker con gvenzl/oracle-free o cualquier servidor)
spring.datasource.url=jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_SERVICE:FREEPDB1}
spring.datasource.username=${ORACLE_USER:UCO}
spring.datasource.password=${ORACLE_PASSWORD:UCO}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.h2.console.enabled=false
