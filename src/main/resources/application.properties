spring.application.name=uco-backend

# Perfil por defecto: H2 en modo compatibilidad Oracle (no requiere nada instalado)
spring.profiles.default=dev

server.port=${PORT:8080}

# La autenticación es por JWT, no se necesita el usuario en memoria de Spring Boot.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# --- Seguridad / JWT ---
uco.jwt.secret=${UCO_JWT_SECRET:uco-dev-secret-cambiar-en-produccion-0123456789abcdef}
uco.jwt.ttl=${UCO_JWT_TTL:PT8H}

# --- Administrador inicial (se crea al arrancar si no existe) ---
uco.admin.email=${UCO_ADMIN_EMAIL:admin@uco.edu.co}
uco.admin.password=${UCO_ADMIN_PASSWORD:Admin123!}
uco.admin.nombre=${UCO_ADMIN_NOMBRE:Administrador UCO}
