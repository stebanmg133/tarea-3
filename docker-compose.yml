name: uco

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: uco-oracle
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    environment:
      # Contraseña de los usuarios SYS/SYSTEM
      ORACLE_PASSWORD: "${ORACLE_SYS_PASSWORD:-oracle}"
      # La imagen crea este usuario de aplicación dentro de la PDB FREEPDB1
      APP_USER: "${ORACLE_USER:-UCO}"
      APP_USER_PASSWORD: "${ORACLE_PASSWORD:-UCO}"
    volumes:
      - oracle-datos:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    restart: unless-stopped

volumes:
  oracle-datos:
